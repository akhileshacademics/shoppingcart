<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple shopping cart page." />
    <title>Cartly | Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Cartly home">cartly<span>.</span></a>
      <nav aria-label="Main navigation">
        <a href="#products">Shop</a>
        <a href="#cart">Cart <span id="header-count" class="cart-badge">3</span></a>
      </nav>
    </header>

    <main id="top" class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">YOUR BAG</p>
        <h1 id="page-title">Shopping cart</h1>
        <p>Review your picks before checkout.</p>
      </section>

      <div class="cart-layout" id="cart">
        <section class="cart-items" aria-label="Products in your cart">
          <div class="section-heading">
            <h2>Items</h2>
            <span id="item-label">3 items</span>
          </div>
          <div id="cart-list"></div>
          <a class="continue-link" href="#products">← Continue shopping</a>
        </section>

        <aside class="order-summary" aria-labelledby="summary-title">
          <h2 id="summary-title">Order summary</h2>
          <div class="summary-row"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
          <div class="summary-row"><span>Shipping</span><strong id="shipping">$0.00</strong></div>
          <div class="promo-area">
            <label for="promo-code">Promo code</label>
            <div class="promo-input">
              <input id="promo-code" type="text" placeholder="Try SAVE10" />
              <button id="apply-promo" type="button">Apply</button>
            </div>
            <p id="promo-message" class="promo-message" aria-live="polite"></p>
          </div>
          <div class="summary-row discount-row" id="discount-row" hidden><span>Discount</span><strong id="discount">-$0.00</strong></div>
          <div class="summary-total"><span>Total</span><strong id="total">$0.00</strong></div>
          <button id="checkout-button" class="checkout-button" type="button">Checkout securely</button>
          <p class="secure-note">🔒 Secure checkout · Taxes calculated at checkout</p>
        </aside>
      </div>

      <section id="products" class="recommendations" aria-labelledby="recommendation-title">
        <p class="eyebrow">YOU MAY ALSO LIKE</p>
        <h2 id="recommendation-title">Complete the look</h2>
        <div class="product-grid" id="product-grid"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="js/app.js"></script>
  </body>
</html>
